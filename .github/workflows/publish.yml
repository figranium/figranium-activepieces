name: Publish to npm

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish.yml']
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        # This repository does not commit a package-lock.json, so npm ci cannot run.
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Verify release version
        if: github.ref == 'refs/heads/main'
        run: |
          test "$(node -p "require('./package.json').version")" = '0.0.2'

      - name: Publish with provenance
        run: npm publish --provenance --access public

      - name: Tag and create v0.0.2 release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag v0.0.2
          git push origin refs/tags/v0.0.2
          gh release create v0.0.2 --verify-tag --title v0.0.2 --notes 'Default new connections to Figranium Cloud; self-hosted URLs remain supported.'
