name: Publish to npm
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish.yml']
permissions:
  contents: write
  actions: write
  id-token: write
jobs:
  tag:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create tag and dispatch publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(node -p "require('./package.json').version")" = '0.0.2'
          git tag v0.0.2
          git push origin refs/tags/v0.0.2
          gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref v0.0.2
  publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Publish with npm trusted publishing
        run: npm publish --provenance --access public
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v0.0.2 --repo "$GITHUB_REPOSITORY" --verify-tag --title v0.0.2 --notes 'Default new connections to Figranium Cloud; self-hosted URLs remain supported.'
